# TLS ve reverse proxy bu dosyanın işi DEĞİL: sunucuda Plesk kurulu ve kendi
# nginx'i 80/443'ü tutuyor, sertifikayı da o yönetiyor. Bir zamanlar burada
# duran caddy servisi o portlara bağlanmaya çalışıp deploy'u düşürürdü.
# Plesk'e yapıştırılacak proxy yönergeleri depoda: deploy/plesk-nginx.conf.
services:
  # Kısa ömürlü migration job'ı. Şemayı uygular ve çıkar; web ona bağlıdır.
  # Migration'ın web container'ının CMD'sinde olmamasının iki sebebi:
  # (1) prisma CLI ayrı bir devDependency paketidir, standalone imajda yoktur;
  # (2) web birden fazla replikaya çıktığında eşzamanlı migrate yarışı olur.
  migrate:
    image: ghcr.io/${GH_OWNER}/macs-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://macs:${POSTGRES_PASSWORD}@db:5432/macs
    depends_on:
      db: { condition: service_healthy }

  collab:
    image: ghcr.io/${GH_OWNER}/macs-collab:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://macs:${POSTGRES_PASSWORD}@db:5432/macs
      PORT: '1234'
      # web ile AYNI sır olmalı: web collab token'ını imzalar, collab onu
      # doğrular. Farklı olursa her websocket bağlantısı reddedilir.
      AUTH_SECRET: ${AUTH_SECRET}
    # YALNIZCA 127.0.0.1'e bağlanır. Öneki düşürmek container'ı doğrudan
    # internete açar ve Plesk'in TLS'ini baypas eden şifresiz bir yol bırakır.
    ports: ['127.0.0.1:1234:1234']
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: ghcr.io/${GH_OWNER}/macs-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://macs:${POSTGRES_PASSWORD}@db:5432/macs
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: 'true'
      # Tarayıcının bağlanacağı collab adresi. Sunucuda okunur ve doküman
      # sayfasından istemciye prop olarak iner — imaja gömülmez, bu yüzden
      # aynı imaj her alan adında çalışır. DOMAIN boşsa ${DOMAIN:?...} patlar;
      # aksi halde COLLAB_URL sessizce "wss:///collab" gibi geçersiz kalırdı.
      COLLAB_URL: wss://${DOMAIN:?DOMAIN gerekli - .env dosyasında tanımlı olmalı}/collab
      UPLOAD_DIR: /data/uploads
    # YALNIZCA 127.0.0.1'e bağlanır — gerekçe collab servisinde yazılı.
    # Konteyner içinde Next 3000'de dinler; Plesk nginx'i 3100'e proxy'ler.
    ports: ['127.0.0.1:3100:3000']
    volumes:
      # scripts/backup.sh bu volume'u adıyla yedekler (macs_uploads).
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: macs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: macs
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macs']
      interval: 10s
      retries: 5

volumes:
  pgdata:
  uploads:
