name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: web imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          target: run
          tags: ghcr.io/${{ github.repository_owner }}/macs-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-web:latest
      - name: migrate imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          target: migrate
          tags: ghcr.io/${{ github.repository_owner }}/macs-migrate:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-migrate:latest
      - name: collab imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          file: collab/Dockerfile
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/macs-collab:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-collab:latest
      - name: VPS'te güncelle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/macs
            # compose.yml ve Caddyfile imajların İÇİNDE değil, sunucudaki bu
            # git checkout'ta yaşıyor (bkz. README "İlk deploy" adım 1) —
            # pull olmadan yeni imajlar eski konfigürasyonla ayağa kalkar ve
            # bu branch'in iki prod düzeltmesi (COLLAB_URL, Caddy matcher'ı)
            # deploy yeşil geçtiği halde sunucuya hiç ulaşmaz.
            git pull
            IMAGE_TAG=${{ github.sha }} docker compose pull web migrate collab
            IMAGE_TAG=${{ github.sha }} docker compose up -d
            # Caddyfile bir bind mount: İÇERİĞİ Compose'un config hash'ine
            # girmez, yalnızca mount tanımı girer. Yani Caddyfile değişse
            # bile `up -d` caddy'yi "up-to-date" görüp DOKUNMAZ ve container
            # eski dosyayla çalışmaya devam eder — Caddy 2 de kendi config
            # dosyasını izlemez. Yeni matcher'ın devreye girmesi için config'i
            # açıkça yeniden yükletmek gerekir.
            docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
