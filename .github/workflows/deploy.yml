name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: web imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          target: run
          tags: ghcr.io/${{ github.repository_owner }}/macs-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-web:latest
      - name: migrate imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          target: migrate
          tags: ghcr.io/${{ github.repository_owner }}/macs-migrate:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-migrate:latest
      - name: collab imajı
        uses: docker/build-push-action@v6
        with:
          push: true
          file: collab/Dockerfile
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/macs-collab:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/macs-collab:latest
      - name: VPS'te güncelle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # sshd standart portta dinlemiyor; action'ın varsayılanı 22 olduğu
          # için bu satır olmadan adım imajlar başarıyla push edildikten sonra
          # "connect: connection refused" ile düşer — yani deploy'un tamamı
          # kırmızı, sunucuda ise hiçbir şey değişmemiş olur.
          #
          # Literal yazmak yerine secret: depo public, port numarasını açıkta
          # tutmanın hiçbir faydası yok. Secret tanımlı değilse boş string
          # gider ve action yine 22'yi dener, o yüzden README adım 5 bunu
          # diğer üçüyle birlikte zorunlu sayar.
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Çok satırlı uzak script'in çıkış kodu SON komutunkidir — burada
            # `docker image prune -f`, ki o pratikte her zaman 0 döner. `set -e`
            # olmadan `git pull` düşse bile adım (ve tüm deploy) YEŞİL raporlar:
            # aşağıdaki `git pull`'un kapatmak için yazıldığı "deploy yeşil ama
            # değişiklik sunucuya ulaşmadı" durumu bir katman derinde aynen
            # tekrarlanırdı.
            #
            # appleboy/ssh-action@v1'de `script_stop` girdisi YOKTUR (kaldırıldı);
            # action'ın kendi README'si karşılığı olarak bunu söyler.
            set -e
            cd /opt/macs
            # compose.yml imajların İÇİNDE değil, sunucudaki bu git checkout'ta
            # yaşıyor (bkz. README "İlk deploy" adım 1) — pull olmadan yeni
            # imajlar eski konfigürasyonla ayağa kalkar ve compose.yml'e giren
            # düzeltmeler (ör. COLLAB_URL) deploy yeşil geçtiği halde sunucuya
            # hiç ulaşmaz.
            git pull
            IMAGE_TAG=${{ github.sha }} docker compose pull web migrate collab
            IMAGE_TAG=${{ github.sha }} docker compose up -d
            # TLS ve reverse proxy Plesk'in işi; bu script ona dokunmaz.
            # deploy/plesk-nginx.conf değiştiyse Plesk panelinden elle
            # güncellenmeli — README "Plesk kurulumu" bölümü bunu söyler.
            docker image prune -f
