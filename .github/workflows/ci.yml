name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: macs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/macs_test
      AUTH_SECRET: ci-only-not-a-real-secret
      # Playwright's webServer builds and starts the app on port 3100
      # (playwright.config.ts, package.json's build/start scripts) — this
      # must match or Auth.js's own idea of its origin is wrong for the
      # server the E2E suite actually talks to.
      AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No explicit version: action-setup reads package.json's
        # "packageManager" field (pnpm@10.23.0) so CI can never drift from
        # what the project actually declares.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # pnpm 10's default-deny build-script gate blocks @prisma/client's
      # postinstall (prisma generate) on a fresh install — confirmed by
      # reproducing a clean checkout locally on pnpm 10.23.0 (the version
      # this job now runs via "packageManager" above): a bare
      # `pnpm install --frozen-lockfile` left node_modules/.prisma missing
      # entirely and `pnpm typecheck` failed with "no exported member
      # 'PrismaClient'" across every file that imports it. Running
      # `prisma generate` directly (not a lifecycle hook) isn't subject to
      # that gate, so this is the explicit, required fix on pnpm 10.
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
