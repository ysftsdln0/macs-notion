# Plesk → Docker reverse proxy yönergeleri
#
# NEREYE: Plesk panel → alan adı → "Apache & nginx Ayarları" → "Ek nginx
# yönergeleri" alanına bu dosyanın TAMAMI yapıştırılır. Kaydettikten sonra
# Plesk nginx'i kendisi yeniden yükler.
#
# ÖN KOŞUL: aynı sayfadaki "Proxy mode" ve "Smart static files processing"
# ÖNCE kapatılmalı. Açıkken Plesk kendi `location /` bloğunu üretir,
# aşağıdaki blokla çakışır ve panel yönergeleri hiç kabul etmez:
#   nginx: [emerg] duplicate location "/" in .../vhost_nginx.conf
# Bu alan adında Apache/PHP'yi devre dışı bırakır; burada tek iş Node
# uygulamasını proxy'lemek olduğu için kayıp yok.
#
# NEDEN DEPODA: bu yönergeler panel içindeki bir metin kutusunda yaşasaydı ne
# sürüm kontrolünden ne code review'dan geçerdi, ve aşağıdaki WebSocket
# başlıkları unutulduğunda ortaya çıkan belirti "doküman editörü eşitlenmiyor"
# olurdu — sessiz, ve deploy'a bağlanması zor. Dosya olarak durunca
# `tests/unit/compose-config.test.ts` yolun compose.yml'deki COLLAB_URL ile
# tutarlı olduğunu doğrulayabiliyor.
#
# TLS: Plesk'in kendi Let's Encrypt sertifikası kullanılır. Docker tarafında
# TLS yoktur ve olmamalıdır — container'lar yalnızca 127.0.0.1'e bağlanır.

# Canlı doküman düzenleme (Hocuspocus). ÖNCE gelmeli: nginx location eşleşmesinde
# daha uzun önek kazanır, ama sıranın açık olması bir sonraki okuyucuya yardım eder.
#
# Hocuspocus provider soketi TAM OLARAK /collab yolunda açar — doküman adını
# protokol mesajında gönderir, yola eklemez, ve sondaki eğik çizgiyi siler.
# Bu yüzden hem çıplak /collab hem /collab/... eşleşmeli.
location /collab {
    proxy_pass http://127.0.0.1:1234/;

    # WebSocket yükseltmesi. Bu üç satır olmadan nginx bağlantıyı sıradan bir
    # HTTP isteği gibi kapatır: sayfa açılır, editör görünür, ama hiçbir şey
    # eşitlenmez ve hiçbir yerde hata çıkmaz.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Yjs bağlantısı uzun ömürlüdür; varsayılan 60 sn'lik okuma zaman aşımı
    # boşta kalan bir editörü düzenli olarak düşürürdü.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Uygulamanın kendisi.
location / {
    proxy_pass http://127.0.0.1:3100;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Auth.js bunu okur: eksikse çerezleri http sanıp Secure bayrağını düşürür
    # ve oturum açma sessizce başarısız olur (AUTH_TRUST_HOST ile birlikte).
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fiş ve logo yüklemeleri; Next'in varsayılanından büyük dosyalar gelebilir.
    client_max_body_size 20m;
}
