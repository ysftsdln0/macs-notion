services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: macs
      POSTGRES_PASSWORD: macs
      POSTGRES_DB: macs
    ports: ['5432:5432']
    volumes: ['macs_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macs']
      interval: 5s
      retries: 10

volumes:
  macs_pgdata:
