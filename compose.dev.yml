services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: macs
      POSTGRES_PASSWORD: macs
      POSTGRES_DB: macs
    ports: ['5433:5432']
    volumes: ['macs_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macs']
      interval: 5s
      retries: 10

  collab:
    build:
      context: .
      dockerfile: collab/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://macs:macs@db:5432/macs
      PORT: '1234'
    ports: ['1234:1234']
    depends_on:
      db: { condition: service_healthy }

volumes:
  macs_pgdata:
